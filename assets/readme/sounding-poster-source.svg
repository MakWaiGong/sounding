      <stop offset="0.7391304348" stop-color="#061824" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#061824" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade-y" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="859">
      <stop offset="0.1164144354" stop-color="white" stop-opacity="0"/>
      <stop offset="0.2677532014" stop-color="white" stop-opacity="1"/>
      <stop offset="0.6984866123" stop-color="white" stop-opacity="1"/>
      <stop offset="0.9313154831" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="title-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1150" height="859"><rect width="1150" height="859" fill="url(#shade-y)"/></mask>
    <radialGradient id="seabed-glow">
